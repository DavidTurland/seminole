# Simple MIME map.
mime text/html   html
mime image/jpeg  jpg
mime image/gif   gif
mime image/png   png

# We are not cross-compiling. So the size of the HttpdUShort 
# is the size of that on the host.
HTTPD_USHRT_SZ = host

# Uncomment this line to align HTML pages on 4 byte boundaries 
# within the library.
define alignment text/html  4

# By default keep everything aligned on 8 byte boundaries. 
define alignment *          8 

# Define external compression helpers and their codepoints.
# You can add new names with the same code point (and associated)
# compressor but with different chunk sizes if performance matters.
define encoding lzrw1kh(1) helper lzrw1kh_compress 16384  \
                                  __source_file__         \
                                  __output_file__

define encoding lzari(2)   helper lzari_compress   16384  \
                                  __source_file__         \
                                  __output_file__

# Load custom script code.
script html.ps

# HTML Preprocessing (optionally keep comments)
filter text/html - perl:common_tokens html-squish
#filter text/html - perl:common_tokens html-squish:keep-comments

# Encode HTML files with LZRW1/KH or LZARI.
encoding text/html lzrw1kh
#encoding text/html lzari

# Here is the content.
path html

# Include directory listings.
use subdirs 
